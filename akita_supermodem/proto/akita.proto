// Define the protocol buffer messages for Akita Supermodem
syntax = "proto3";

package akita; // Optional: Add a package name for better organization

enum ProtocolType {
  PROTOCOL_SUPERMODEM = 0;
  PROTOCOL_XMODEM = 1;
  PROTOCOL_YMODEM = 2;
  PROTOCOL_ZMODEM = 3;
  PROTOCOL_KERMIT = 4;
}

message KeyExchange {
  // Sender's public key for ECDH (X25519)
  bytes public_key = 1;
  // Ephemeral session ID to track the exchange
  string session_id = 2;
  // Selected protocol type
  ProtocolType protocol = 3;
}

// Encrypted Payload message for everything after KeyExchange
message EncryptedPayload {
  string session_id = 1;
  bytes nonce = 2;
  // ChaCha20-Poly1305 output (includes 16-byte MAC)
  bytes ciphertext = 3; 
}

// Message sent by the sender to initiate a file transfer.
message FileStart {
  string filename = 1;
  uint64 total_size = 2;
  uint32 piece_size = 3;
  optional string merkle_root = 4;
  repeated string piece_hashes = 5;
}

// Message carrying a single piece (chunk) of the file data.
message PieceData {
  uint32 piece_index = 1;
  bytes data = 2;
}

// Message sent by the receiver to the sender to request missing pieces
message ResumeRequest {
  repeated uint32 missing_indices = 1;
  repeated uint32 acknowledged_indices = 2;
}

message Acknowledgement {
  uint32 piece_index = 1;
}

// Wrapper for messages that are encrypted inside EncryptedPayload
message InnerMessage {
  oneof payload {
    FileStart file_start = 1;
    PieceData piece_data = 2;
    ResumeRequest resume_request = 3;
    Acknowledgement acknowledgement = 4;
    bytes raw_data = 5;
  }
}

// Wrapper message containing one of the specific Akita message types.
message AkitaMessage {
  oneof payload {
    KeyExchange key_exchange = 1;
    EncryptedPayload encrypted_payload = 2;
    
    // Fallback/plaintext messages for backwards compatibility (optional)
    FileStart file_start = 3;
    PieceData piece_data = 4;
    ResumeRequest resume_request = 5;
    Acknowledgement acknowledgement = 6;
  }
}
