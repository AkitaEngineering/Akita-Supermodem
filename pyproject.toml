[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "akita-supermodem"
version = "0.1.0"
authors = [
  { name="Akita Engineering", email="info@akitaengineering.com" },
]
description = "Robust file transfer protocol for Meshtastic networks"
readme = "README.md"
license = { file="LICENSE" } # Refers to the LICENSE file (should contain GPLv3 text)
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)", # Updated classifier
    "Operating System :: OS Independent",
    "Topic :: Communications",
    "Topic :: System :: Networking",
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "protobuf>=7.34.1,<8.0.0",
    "meshtastic>=2.0.0",
    "cryptography>=41.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "click>=8.1.0",
]

[project.urls]
"Homepage" = "https://github.com/AkitaEngineering/akita-supermodem"
"Bug Tracker" = "https://github.com/AkitaEngineering/akita-supermodem/issues"
"Website" = "https://www.akitaengineering.com"

[project.scripts]
akita-supermodem = "akita_supermodem.cli:cli"

